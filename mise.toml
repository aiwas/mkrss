[tools]
dotnet = "10"

[tasks.build]
description = "アプリケーションをビルドします。"
run = "dotnet build MkRss.slnx"

[tasks.dev]
description = "開発モードで起動します。"
run = "ASPNETCORE_ENVIRONMENT=Development dotnet watch run --project src/MkRss.Web/MkRss.Web.csproj"

[tasks.test]
description = "テストを実行します。"
usage = '''
flag "--include-integrated" help="統合テストを含める"
'''
run = '''
#!/usr/bin/env bash
#echo "value=${usage_include_integrated}"
if [ "${usage_include_integrated:-false}" = "true" ]; then
  #echo "true!"
  MKRSS_INTEGRATION_TESTS=1 dotnet test --solution MkRss.slnx
else
  #echo "false!"
  dotnet test --solution MkRss.slnx
fi
'''
